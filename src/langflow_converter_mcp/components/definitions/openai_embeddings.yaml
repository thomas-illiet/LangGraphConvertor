definition_version: "2.0.0"
type: OpenAIEmbeddings
aliases: [OpenAIEmbeddings]
langflow_series: 1.12.x
category: resource
description: Configure an OpenAI-compatible embedding model.
langgraph_role: embeddings factory
capabilities: [embeddings, rag]
config:
  - name: model
    source_keys: [model, model_name]
    type: string
    description: Embedding model identifier.
    required: true
    overridable: true
  - name: base_url
    source_keys: [base_url, openai_api_base]
    type: string
    description: Runtime OpenAI-compatible API base URL.
    required: true
    environment: OPENAI_BASE_URL
    overridable: false
  - name: api_key
    source_keys: [api_key, openai_api_key]
    type: secret
    description: Runtime embedding API credential.
    required: true
    environment: OPENAI_API_KEY
    overridable: false
  - name: dimensions
    source_keys: [dimensions]
    type: integer
    description: Optional embedding vector size.
    required: false
    minimum: 1
    overridable: false
inputs: []
outputs:
  - name: embeddings
    source_names: [embeddings]
    types: [Embeddings]
    description: Configured embeddings resource.
state_reads: []
state_writes: []
dependencies: [langchain-openai]
recipe:
  mode: factory
  async_supported: true
  streaming: false
  imports: [langchain_openai.OpenAIEmbeddings]
  construction: [Require OPENAI_BASE_URL and OPENAI_API_KEY at runtime and pass both explicitly to OpenAIEmbeddings with the normalized model configuration.]
  invocation: Inject the resource into the connected vector store or embedding node.
  error_handling: [Report provider failures without exposing credentials.]
invariants: [Never embed the API key or source endpoint, Require non-empty OPENAI_BASE_URL and OPENAI_API_KEY, Use the same dimensions for indexing and querying.]
tests:
  - name: embeds_documents_and_query
    scenario: Mock document and query requests against parameterized local and remote OpenAI-compatible endpoints.
    expected: Both paths use the selected DSL model, runtime endpoint and token, and the same dimensions.
  - name: rejects_missing_provider_environment
    scenario: Start with either OPENAI_BASE_URL or OPENAI_API_KEY absent or empty.
    expected: Construction fails with an explicit configuration error before a provider request.
ignored_source_fields: [chunk_size]
