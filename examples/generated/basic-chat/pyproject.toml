[project]
name = "basic-chat"
version = "0.1.0"
description = "LangGraph conversion of the basic-chat Langflow flow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3,<1.0",
    "langchain-openai>=0.3,<1.0",
    "langgraph>=0.4,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basic_chat"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "contract: conversion contract tests for the generated project",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "RET",
    "PTH",
    "PLC",
    "PLE",
    "PLW",
    "D",
]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103"]

[tool.ty.environment]
root = ["src"]
